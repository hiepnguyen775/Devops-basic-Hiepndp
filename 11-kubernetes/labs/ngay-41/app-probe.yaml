apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-khoe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-khoe
  template:
    metadata:
      labels:
        app: web-khoe
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80

          # Tạo 2 file làm "công tắc sức khoẻ" để lát nữa ta tự tay tắt
          command: ["/bin/sh", "-c"]
          args:
            - echo "OK" > /usr/share/nginx/html/khoe.html
              && echo "SAN SANG" > /usr/share/nginx/html/san-sang.html
              && echo "Xin chào từ $HOSTNAME" > /usr/share/nginx/html/index.html
              && nginx -g 'daemon off;'

          # 1) Khởi động xong chưa? Cho tối đa 30 x 2 = 60 giây
          startupProbe:
            httpGet:
              path: /khoe.html
              port: 80
            periodSeconds: 2
            failureThreshold: 30

          # 2) Nhận khách được chưa? Trượt -> RÚT KHỎI SERVICE (không giết)
          readinessProbe:
            httpGet:
              path: /san-sang.html
              port: 80
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          # 3) Còn cứu được không? Trượt -> GIẾT VÀ TẠO LẠI
          livenessProbe:
            httpGet:
              path: /khoe.html
              port: 80
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"      # limits RAM: có. limits CPU: cố ý không đặt (mục 5)
---
apiVersion: v1
kind: Service
metadata:
  name: web-khoe-svc
spec:
  selector:
    app: web-khoe
  ports:
    - port: 80
      targetPort: 80
