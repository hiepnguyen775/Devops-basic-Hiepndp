name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone-cloudnote/backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài dependency
        run: |
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check . || true   # 🔧 TODO: bỏ "|| true" khi đã sửa hết lint

      - name: Test (pytest)
        run: pytest -q || echo "🔧 TODO: viết test trong backend/tests/"

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy quét lỗ hổng (filesystem + dependency)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: capstone-cloudnote
          severity: HIGH,CRITICAL
          exit-code: "0"   # 🔧 TODO: đổi thành "1" để CHẶN khi có lỗ hổng nghiêm trọng

  build:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v7
      - name: Build thử image (không push ở CI)
        run: |
          docker build -t cloudnote-backend:ci  capstone-cloudnote/backend
          docker build -t cloudnote-frontend:ci capstone-cloudnote/frontend
