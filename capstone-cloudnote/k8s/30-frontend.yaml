# Frontend: Deployment + Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cloudnote
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # 🔧 TODO: đổi thành image của bạn
          image: ghcr.io/CHANGE_ME/cloudnote-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "64Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cloudnote
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
