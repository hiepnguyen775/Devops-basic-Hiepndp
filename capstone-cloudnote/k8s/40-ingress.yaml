# Ingress: 1 điểm vào, định tuyến / -> frontend, /api -> backend.
# Cần Ingress Controller (vd nginx-ingress). Trên Minikube: minikube addons enable ingress
#
# Sau khi apply, thêm host vào /etc/hosts:
#   <minikube ip>  cloudnote.local
# rồi mở http://cloudnote.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudnote
  namespace: cloudnote
  # KHÔNG dùng rewrite-target: backend giữ nguyên prefix /api (route là /api/notes).
spec:
  ingressClassName: nginx
  rules:
    - host: cloudnote.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
# 🔧 TODO nâng cao: thêm TLS bằng cert-manager + Let's Encrypt (block tls:)
