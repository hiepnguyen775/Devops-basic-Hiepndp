# Backend API: Deployment + Service + HPA. Có probe + resource limits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cloudnote
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # 0 downtime
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # 🔧 TODO: đổi thành image của bạn (CI sẽ push tag theo SHA)
          image: ghcr.io/CHANGE_ME/cloudnote-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cloudnote-config
            - secretRef:
                name: cloudnote-secret
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cloudnote
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
# Auto-scale 2 → 5 pod khi CPU > 60% (cần Metrics Server đã cài)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: cloudnote
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
