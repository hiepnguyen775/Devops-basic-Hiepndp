<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📝 CloudNote</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 16px; background: #f7f9fc; color: #1a2233; }
    h1 { text-align: center; }
    form { background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 24px; }
    input, textarea { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #d0d7e2; border-radius: 8px; font: inherit; }
    button { background: #1976d2; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; cursor: pointer; font: inherit; }
    button:hover { background: #1565c0; }
    .note { background: #fff; padding: 14px 16px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .note h3 { margin: 0 0 6px; }
    .note small { color: #889; }
    #status { text-align: center; color: #c62828; min-height: 20px; }
  </style>
</head>
<body>
  <h1>📝 CloudNote</h1>

  <form id="form">
    <input id="title" placeholder="Tiêu đề note..." maxlength="200" required />
    <textarea id="content" placeholder="Nội dung..." rows="3"></textarea>
    <button type="submit">Lưu note</button>
  </form>

  <div id="status"></div>
  <div id="list"></div>

  <script>
    const API = "/api/notes"; // nginx/Ingress chuyển tiếp tới backend
    const $ = (id) => document.getElementById(id);

    async function load() {
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const notes = await res.json();
        $("list").innerHTML = notes.map(n =>
          `<div class="note"><h3>${escapeHtml(n.title)}</h3>
           <div>${escapeHtml(n.content || "")}</div>
           <small>${new Date(n.created_at).toLocaleString("vi-VN")}</small></div>`
        ).join("") || "<p style='text-align:center;color:#889'>Chưa có note nào.</p>";
        $("status").textContent = "";
      } catch (e) {
        $("status").textContent = "Không tải được note: " + e.message;
      }
    }

    $("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const body = { title: $("title").value.trim(), content: $("content").value.trim() };
      if (!body.title) return;
      try {
        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        $("title").value = ""; $("content").value = "";
        load();
      } catch (e) {
        $("status").textContent = "Lưu thất bại: " + e.message;
      }
    });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
    }

    load();
    // 📝 TODO: thêm nút Xóa (gọi DELETE /api/notes/{id}) sau khi bạn làm xong endpoint DELETE ở backend.
  </script>
</body>
</html>
