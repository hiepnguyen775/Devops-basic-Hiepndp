server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Phục vụ file tĩnh (SPA fallback về index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: mọi request /api/* chuyển tới backend (giữ nguyên path /api/...)
    # Ở local (docker-compose) service backend tên là "backend".
    # Trên Kubernetes, Ingress sẽ định tuyến /api -> Service backend nên block này không bị dùng tới.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
